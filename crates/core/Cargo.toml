[package]
name = "aether-sonde"
description = "Discrete-event simulation core for Ethernet-like signal propagation and CSMA/CD on graphs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Opt-in `serde` derives on every public type. Used by binding crates
# (e.g., `aether-sonde-wasm`) that marshal core types across an FFI or
# WASM boundary. With `default = []`, downstream Rust consumers without
# this feature pay zero cost — no `serde` dep, no derive bloat.
serde = ["dep:serde"]

[dependencies]
# Optional serde for boundary marshaling. Not enabled by default. Uses
# default features (std) — internally-tagged enum derives require it.
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
# Property-based testing for invariants and high-input-space differential
# checks per the codex's `Edge Cases and Properties` and `Evidence Ladder
# for Testing` notes. Used only in `tests/properties.rs`.
proptest = "1"
