name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages requires these permissions on the deploy job.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel an in-flight Pages deploy.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Opt JavaScript actions into Node 24 ahead of the June 2026 default
  # switch. Suppresses the Node 20 deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build rustdoc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

      - name: Add root index redirect
        # Pages serves target/doc/ as the site root; without an index.html
        # there, the root URL is empty. Redirect to the main crate's docs.
        run: |
          echo '<meta http-equiv="refresh" content="0; url=aether_sonde/index.html">' \
            > target/doc/index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages via the API on first run if it isn't enabled
          # already. The job already has `pages: write`. After the first
          # successful run, this is a no-op.
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
