name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Opt JavaScript actions into Node 24 ahead of the June 2026 default
  # switch. Suppresses the Node 20 deprecation warning. Remove this
  # once all pinned actions ship Node 24-native versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  verify:
    name: build / clippy / test / doc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: cargo test --all-targets
        run: cargo test --workspace --all-targets

      - name: cargo test --doc
        run: cargo test --workspace --doc

      - name: cargo doc -D warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  wasm:
    name: wasm-pack build + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: wasm-pack build (bundler target, release)
        run: wasm-pack build --target bundler --release crates/wasm

      - name: wasm-pack test (Node)
        run: wasm-pack test --node crates/wasm

  ts:
    name: TS adapter — typecheck + vitest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo and target
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: latest

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The TS adapter consumes the wasm-pack output via a `file:` link;
      # build it before `npm install` so the package resolves.
      - name: wasm-pack build (bundler target)
        run: wasm-pack build --target bundler --release crates/wasm

      - name: npm install
        run: npm install --prefix packages/ts-sim

      - name: tsc --noEmit
        run: npm run typecheck --prefix packages/ts-sim

      - name: vitest
        run: npm test --prefix packages/ts-sim
