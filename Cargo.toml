[workspace]
members = ["crates/*"]
default-members = ["crates/core"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
authors = ["Aether Sonde contributors"]
repository = "https://github.com/Anjin-Byte/aether-sonde"

[workspace.dependencies]
# Intentionally empty. The core crate has no runtime dependencies.
# Adapter and binary crates added in later phases populate this section.

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
# Real footguns. Per the codex (Result vs Panic, Clippy as Discipline),
# these are warnings — not denies — so deliberate uses with a comment can
# be allowed locally with a noted invariant.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"

# Pedantic — opt in with low priority so individual lints can override.
pedantic = { level = "warn", priority = -1 }

# Common pedantic lints to relax.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"

[profile.dev]
opt-level = 1
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
